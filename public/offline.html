<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2f7c7a" />
    <title>Mamakare — Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f8fbfb;
        color: #24313b;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 420px;
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
      }
      h1 {
        margin: 0;
        font-size: 1.75rem;
      }
      p {
        color: #66757f;
        line-height: 1.6;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        background: #2f7c7a;
        color: white;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icons/mamakare.svg" alt="Mamakare" />
      <h1>You’re offline</h1>
      <p>
        The Mamakare application shell is available, but this page needs an internet connection. No
        clinical records have been stored offline.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
